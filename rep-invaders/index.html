<script>
(()=>{
'use strict';
/* ================= CONFIG ================= */
const APP_VERSION='1.25';
const CFG={
  W:224,H:256,S:3,
  colors:{bg:'#080808',gold:'#D7AA38',goldDk:'#9C7A22',white:'#F3F3E9',red:'#D93C38',redDk:'#8E2422',
          grey:'#737373',greyLt:'#AAAAA2',greyDk:'#3A3A3D',skin:'#D9A066',hair:'#3B2A1C',singlet:'#2A2A2E'},
  player:{y:213,speed:1.6,minX:6,w:13,h:11},
  bullet:{speed:5},
  alien:{cols:11,startX:26,startY:56,spacingX:16,spacingY:16,step:2,drop:8,maxLower:3},
  rackY:188,groundY:236,
  lives:4,extraLifeEvery:1000,
  shaker:{y:28,speed:.8,interval:1400,minAliens:8},
  setNames:['BEGINNER','WARMING UP','GETTING STRONGER','HEAVY LIFTING','BEAST MODE'],
  cheers:['SET COMPLETE!','KEEP PUSHING!','NO LIMITS!','ONE MORE REP!','FEEL THE BURN!','BEAST MODE!','STAY STRONG!'],
  shakerPts:[100,50,50,100,150,100,100,50,300,100,100,100,50,150,100],
  storageKey:'nl-rep-invaders-v1'
};
const {W,H,S}=CFG, C=CFG.colors;
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
const TXT={
  start:TOUCH?'TAP TO START WORKOUT':'PRESS ENTER TO START',
  again:TOUCH?'TAP TO TRAIN AGAIN':'PRESS ENTER TO TRAIN AGAIN',
  resume:TOUCH?'TAP REST TO RESUME':'PRESS P TO RESUME'
};

/* ================= SPRITES ================= */
const PAL={W:C.white,G:C.gold,g:C.goldDk,R:C.red,r:C.redDk,M:C.grey,m:C.greyLt,D:C.greyDk,S:C.skin,B:C.hair,K:C.singlet};
function mk(rows,tint){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'){g.fillStyle=tint||PAL[ch]||C.white;g.fillRect(x,y,1,1);}}});
  return{c,w,h,rows};
}
const grid=(w,h)=>Array.from({length:h},()=>Array(w).fill('.'));
function put(g,rows,ox,oy){rows.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]!=='.'&&g[oy+y]&&ox+x>=0&&ox+x<g[0].length)g[oy+y][ox+x]=r[x];});}
const rowsOf=g=>g.map(r=>r.join(''));
function dumbbell(lo,ro){const g=grid(12,8),head=[".MM.","MmMM","MmMM","MMMM","MMMM","MMMM",".MM."];put(g,head,0,lo);put(g,head,8,ro);for(let x=4;x<8;x++){g[3][x]='m';g[4][x]='M';}return mk(rowsOf(g));}
function plate(hx,hy){const g=["..MMMM..",".MmmmmM.","MmMMMMmM","MmM..MmM","MmM..MmM","MmMMMMmM",".MmmmmM.","..MMMM.."].map(r=>r.split(''));g[hy][hx]='W';g[7-hy][7-hx]='D';return mk(rowsOf(g));}
function debris(seed){let s=seed;const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;const cols='GKSMWG';const rows=[];for(let y=0;y<11;y++){let r='';for(let x=0;x<15;x++){const p=y>7?.75:y>4?.35:.12;r+=rnd()<p?cols[(rnd()*cols.length)|0]:'.';}rows.push(r);}return mk(rows);}
const PLAYER_IDLE=["....BBBBB....","....BSSSB....",".....SSS.....","..SSGKKKGSS..",".SSSGKKKGSSS.",".SS.GKGKG.SS.",".SS.KKKKK.SS.",".SS.GGGGG.SS.","....MMMMM....","....MM.MM....","....SS.SS...."];
const PLAYER_LIFT=[".SS..BBB..SS.",".SS.BBBBB.SS.",".SS.BSSSB.SS.",".SS..SSS..SS.","..SSGKKKGSS..","...SGKKKGS...","....GKGKG....","....KKKKK....","....GGGGG....","....MMMMM....","....MM.MM...."];
const SPR={
  kb:[mk(["..GGGGG..",".G.....G.",".GG...GG.","..GGGGG..",".GGWGGGG.","GGWGGGGGG","GgGGGGGgG",".GG...GG."]),
      mk(["..GGGGG..",".G.....G.",".GG...GG.","..GGGGG..",".GGGGWGG.","GGGGGGWGG","GgGGGGGgG","GG.....GG"])],
  db:[dumbbell(0,1),dumbbell(1,0)],
  plate:[plate(2,1),plate(5,1)],
  bar:[mk(["M..........M","MM........MM","MMWWWWWWWWMM","MM........MM","M..........M"]),
       mk(["M..........M","MM........MM","MMWW....WWMM","MM..WWWW..MM","M..........M"])],
  heavy:[mk(["RR........RR","RrR......RrR","RrRG....GRrR","RrRGWWWWGRrR","RrRG....GRrR","RrR......RrR","RR........RR"]),
         mk(["RR........RR","RrR......RrR","RrRG....GRrR","RrRGW..WGRrR","RrRG.WW.GRrR","RrR......RrR","RR........RR"])],
  boom:mk(["W...G..G...W",".G..W..W..G.","..W......W..","GG........GG","..W......W..",".G..W..W..G.","W...G..G...W"]),
  spark:mk(["G.W.G.",".WGW..","GW.WGG",".WGW..","G.W.G."]),
  player:mk(PLAYER_IDLE),playerLift:mk(PLAYER_LIFT),
  playerHit:mk(PLAYER_IDLE,C.red),
  pdie:[debris(7),debris(91)],
  life:mk(["..BBB..","..SSS..","SSGKGSS","S.KKK.S","..GGG..","..M.M.."]),
  shaker:[mk(["..WWWW..","..WWWW..",".MMMMMM.",".GGGGGG.","GWGGGGGG","GWKKKKGG","GGKGGKGG","GGKKKKGG","GgGGGGgG","GgGGGGgG",".GGGGGG."]),
          mk(["..WWWW..",".WWWW...",".MMMMMM.",".GGGGGG.","GGGGGWGG","GGKKKKWG","GGKGGKGG","GGKKKKGG","GgGGGGgG","GgGGGGgG",".GGGGGG."])],
  bolt:mk(["GGG","GWG","GGG"])
};
const TYPES=[{k:'kb',pts:30,name:'KETTLEBELL'},{k:'db',pts:20,name:'DUMBBELL'},{k:'plate',pts:20,name:'WEIGHT PLATE'},{k:'bar',pts:10,name:'BARBELL'},{k:'heavy',pts:10,name:'HEAVY BAR'}];
// Squat rack barrier: palette index per pixel (0 = empty). Damage clears pixels.
const RACK_W=22,RACK_H=16,RACK_COL=[null,C.gold,C.greyLt,C.grey,C.greyDk,C.white,C.red];
function rackShape(){
  const IDX={G:1,m:2,M:3,D:4,W:5,R:6},d=new Uint8Array(RACK_W*RACK_H);
  for(let y=0;y<RACK_H;y++)for(let x=0;x<RACK_W;x++){
    let ch='.';
    if(y<=1){if(x>=1&&x<=20)ch='G';}
    else if((x>=1&&x<=3)||(x>=18&&x<=20))ch='m';
    else if(x===0||x===21){if(y>=3&&y<=9)ch='R';}
    else if(y<=9)ch=(x%3===0||y%3===0)?'M':'D';
    else if(x<=5||x>=16)ch='M';
    if(y===6&&(x<=1||x>=20||ch!=='.'))ch='W';
    d[y*RACK_W+x]=IDX[ch]||0;
  }
  return d;
}

/* ================= AUDIO ================= */
const Audio=(()=>{
  let ac=null,muted=false,noiseBuf=null,loop=null;
  function init(){
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){ac=null;}}
    if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  }
  function env(vol,dur,at){const g=ac.createGain();g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);g.connect(ac.destination);return g;}
  function tone(f,dur,o={}){if(!ac||muted)return;const at=ac.currentTime+(o.delay||0),os=ac.createOscillator();os.type=o.type||'square';os.frequency.setValueAtTime(f,at);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,at+dur);os.connect(env(o.vol||.06,dur,at));os.start(at);os.stop(at+dur+.03);}
  function noise(dur,o={}){if(!ac||muted)return;const at=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=o.freq||1000;f.Q.value=o.q||.8;s.connect(f).connect(env(o.vol||.2,dur,at));s.start(at);s.stop(at+dur+.03);}
  const arp=(notes,step,o={})=>notes.forEach((n,i)=>tone(n,o.len||.12,{...o,delay:i*step}));
  const BEAT=[62,55,49,46];
  const fx={
    shoot(){tone(520,.1,{to:1500,vol:.045});},
    kill(){noise(.18,{freq:900,vol:.2});tone(700,.14,{to:110,vol:.04});},
    hit(){noise(1,{freq:380,vol:.3,q:.5});tone(330,.8,{to:60,type:'sawtooth',vol:.05});},
    shakerHit(){arp([784,988,1175,1568],.06,{vol:.05,len:.1});},
    setDone(){arp([523,659,784,1046],.09,{vol:.06,len:.14});},
    over(){arp([392,330,262,196],.18,{vol:.06,len:.22,type:'triangle'});},
    pb(){arp([523,659,784,1046,784,1046,1318],.08,{vol:.06,len:.12});},
    life(){arp([660,880,1100],.09,{vol:.05});},
    beat(i){tone(BEAT[i],.1,{vol:.16,to:BEAT[i]*.92});}
  };
  function loopStart(){if(!ac||muted||loop)return;const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();o.type='triangle';o.frequency.value=880;l.type='square';l.frequency.value=6;lg.gain.value=220;g.gain.value=.05;l.connect(lg).connect(o.frequency);o.connect(g).connect(ac.destination);o.start();l.start();loop=[o,l];}
  function loopStop(){if(loop){loop.forEach(n=>{try{n.stop()}catch(e){}});loop=null;}}
  return{init,fx,loopStart,loopStop,get muted(){return muted},set muted(v){muted=v;if(v)loopStop();}};
})();

function hitRack(x,y,w,h){
  for(const b of G.racks){
    const x0=Math.max(x|0,b.x),x1=Math.min(Math.ceil(x+w),b.x+RACK_W),y0=Math.max(y|0,b.y),y1=Math.min(Math.ceil(y+h),b.y+RACK_H);
    if(x0>=x1||y0>=y1)continue;
    for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)if(b.d[(yy-b.y)*RACK_W+xx-b.x])return{b,lx:xx-b.x,ly:yy-b.y};
  }
  return null;
}
function damage(b,lx,ly){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=lx+dx,y=ly+dy;if(x<0||x>=RACK_W||y<0||y>=RACK_H)continue;if((!dx&&!dy)||Math.random()<.6)b.d[y*RACK_W+x]=0;}}
function eraseRacks(bx){for(const b of G.racks){const x0=Math.max(bx.x,b.x),x1=Math.min(bx.x+bx.w,b.x+RACK_W),y0=Math.max(bx.y,b.y),y1=Math.min(bx.y+bx.h,b.y+RACK_H);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)b.d[(y-b.y)*RACK_W+x-b.x]=0;}}

function edgeHit(){for(const a of G.aliens){if(!a.alive)continue;const b=alienBox(a);if(b.x+G.dx<6||b.x+b.w+G.dx>W-6)return true;}return false;}
function stepAliens(){
  const al=G.aliens;
  while(G.ptr<al.length&&!al[G.ptr].alive)G.ptr++;
  if(G.ptr>=al.length){
    G.ptr=0;
    if(G.dropPending){G.dropPending=false;G.dx=-G.dx;}else if(edgeHit())G.dropPending=true;
    if(G.frame-G.lastBeat>=6){Audio.fx.beat(G.beatIdx);G.beatIdx=(G.beatIdx+1)%4;G.lastBeat=G.frame;}
    return;
  }
  const a=al[G.ptr++];
  if(G.dropPending)a.y+=CFG.alien.drop;else a.x+=G.dx;
  a.f^=1;
  const b=alienBox(a);
  if(b.y+b.h>CFG.rackY)eraseRacks(b);
  if(b.y+b.h>=G.player.y)G.invaded=true;
}
function alienFire(){
  if(--G.fireTimer>0)return;
  G.fireTimer=Math.max(22,60-G.wave*4)+(Math.random()*36|0);
  const n=aliveCount(),maxB=Math.min(3,1+(G.wave>>1)+(n<22?1:0));
  if(G.aBullets.length>=maxB)return;
  const cols={};for(const a of G.aliens)if(a.alive&&(!cols[a.c]||a.y>cols[a.c].y))cols[a.c]=a;
  const list=Object.values(cols);if(!list.length)return;
  let pick;
  if(Math.random()<.3+Math.min(G.wave,4)*.04){const pc=G.player.x+6;pick=list.reduce((m,a)=>{const b=alienBox(a),d=Math.abs(b.x+b.w/2-pc);return d<m.d?{a,d}:m},{a:null,d:1e9}).a;}
  else pick=list[Math.random()*list.length|0];
  const b=alienBox(pick);
  G.aBullets.push({x:(b.x+b.w/2)|0,y:b.y+b.h,kind:Math.random()*2|0,f:0,v:1.0+Math.min(G.wave,6)*.1+(n<10?.3:0)});
}

function killPlayer(){buzz([80,40,160]);G.state='dying';G.timer=110;G.aBullets=[];G.pBullet=null;G.shaker=null;Audio.loopStop();Audio.fx.hit();if(!REDUCED)G.shake=14;}

const short=m=>String(m||'').toUpperCase().replace(/[^A-Z0-9 .,!?:'$-]/g,'').slice(0,26);
const isNetErr=e=>/load failed|failed to fetch|networkerror|network request|fetch|timed? ?out|offline/i.test(String(e&&e.message||e));
const friendly=e=>{const m=String(e&&e.message||'');
  if(isNetErr(e))return 'NO CONNECTION. WILL RETRY';
  if(/too many/i.test(m))return 'SAVED (ONE PER 15 SECONDS)';

const Q_KEY='nl-ri-score-queue';
const Queue={
  get(){try{return JSON.parse(localStorage.getItem(Q_KEY)||'[]')}catch(e){return[]}},
  set(q){try{localStorage.setItem(Q_KEY,JSON.stringify(q.slice(-10)))}catch(e){}},
  add(r){const q=this.get();q.push({score:r.score,set:r.set,id:r.id});this.set(q);},
  drop(id){this.set(this.get().filter(x=>x.id!==id));}
};
let flushing=false,retryTimer=null;
async function flushQueue(){
  if(flushing||!Online.ready)return;flushing=true;clearTimeout(retryTimer);
  let saved=0;
  try{
    for(const r of Queue.get()){
      try{await Online.submit(r.score,r.set);Queue.drop(r.id);saved++;if(G.saveId===r.id)G.save='SAVED TO TOP 10 BOARD';}
      catch(e){
        if(isNetErr(e)){if(G.saveId===r.id)G.save='NO CONNECTION. WILL RETRY';retryTimer=setTimeout(flushQueue,8000);break;}
        Queue.drop(r.id);if(G.saveId===r.id)G.save=friendly(e);
      }
    }
    if(saved)Online.refresh();
  }finally{flushing=false;}
}
['online','pageshow'].forEach(ev=>addEventListener(ev,()=>flushQueue()));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)flushQueue();});

  clear(){try{localStorage.removeItem(UNSAVED_KEY)}catch(e){}}
};
function adoptUnsaved(){

function saveResult(r){
  if(r.score<=0){G.save='';return;}
  const id=Date.now()+'-'+r.score;
  if(!Online.available){G.save='OFFLINE: SAVED ON DEVICE';return;}
  if(!Online.ready){G.unsavedId=id;Unsaved.keep({score:r.score,set:r.set,id});
    const u=Unsaved.get();G.save=u&&u.id===id?'NOT ON THE BOARD YET':'YOUR BEST IS KEPT FOR YOU';return;}
  G.saveId=id;G.save='SAVING SCORE...';
  Queue.add({score:r.score,set:r.set,id});flushQueue();
}

const CLAIM_KEY='nl-ri-pending-claim';
function doClaim(){
  if(!Online.available){G.prize={status:'offline'};return;}
  if(!Online.ready){
    G.prize={status:'signin'};
    try{localStorage.setItem(CLAIM_KEY,JSON.stringify({score:G.score,sets:10}))}catch(e){}
    UI.open(Online.user?'nick':'auth',{tab:'join',intro:'Sign in or join to claim your $100 voucher.'});
    return;
  }
  G.prize={status:'claiming'};
  try{localStorage.setItem(CLAIM_KEY,JSON.stringify({score:G.score,sets:10}))}catch(e){}
  Online.claim(G.score,10).then(code=>{
    try{localStorage.removeItem(CLAIM_KEY)}catch(e){}
    G.prize=code?{status:'code',code}:{status:'desk'};Online.refresh();Online.loadTally();
    if(code)Online.emailVoucher().then(sent=>{if(G.prize&&G.prize.code===code)G.prize.emailed=sent;});
  }).catch(e=>{
    if(isNetErr(e)){G.prize={status:'claiming',retry:true};setTimeout(()=>{if(G.state==='prize'&&G.prize&&G.prize.retry)doClaim();},5000);return;}
    try{localStorage.removeItem(CLAIM_KEY)}catch(_){}
    G.prize={status:'error',msg:short(e.message)};});
}

function claimSaved(){

}
function movePB(){
  const pb=G.pBullet;pb.y-=CFG.bullet.speed;
  const bx=pb.x-1,by=pb.y,bw=3,bh=3;
  if(pb.y<24){G.booms.push({x:pb.x-3,y:24,t:12,kind:'spark'});G.pBullet=null;return;}
  for(const a of G.aliens){
    if(!a.alive)continue;const b=alienBox(a);
    if(bx<b.x+b.w&&bx+bw>b.x&&by<b.y+b.h&&by+bh>b.y){a.alive=false;buzz(12);addScore(TYPES[a.t].pts);G.booms.push({x:b.x+((b.w-12)>>1),y:b.y,t:16,kind:'boom'});Audio.fx.kill();G.pBullet=null;return;}
  }
  const sh=G.shaker;
  if(sh&&bx<sh.x+8&&bx+bw>sh.x&&by<sh.y+11&&by+bh>sh.y){
    const p=CFG.shakerPts[G.shots%15];addScore(p);G.booms.push({x:sh.x+4,y:sh.y+2,t:90,kind:'bonus',text:'+'+p});
    G.shaker=null;Audio.loopStop();Audio.fx.shakerHit();G.pBullet=null;return;
  }
  for(let i=0;i<G.aBullets.length;i++){const ab=G.aBullets[i];if(Math.abs(ab.x-pb.x)<=2&&by<ab.y+7&&by+bh>ab.y){G.aBullets.splice(i,1);G.booms.push({x:pb.x-3,y:pb.y,t:10,kind:'spark'});G.pBullet=null;return;}}
  const h=hitRack(bx,by,bw,bh);if(h){damage(h.b,h.lx,h.ly);G.booms.push({x:pb.x-3,y:pb.y-1,t:6,kind:'spark'});G.pBullet=null;}
}
function moveAB(){
  const P=G.player;
  for(let i=G.aBullets.length-1;i>=0;i--){
    const b=G.aBullets[i];b.y+=b.v;if(G.frame%4===0)b.f^=1;
    const h=hitRack(b.x-1,b.y,3,7);if(h){damage(h.b,h.lx,h.ly);G.aBullets.splice(i,1);continue;}
    if(b.y+7>=P.y+2&&b.y<P.y+CFG.player.h&&b.x+1>=P.x+1&&b.x-1<P.x+CFG.player.w-1){killPlayer();return;}
    if(b.y+7>=CFG.groundY){G.booms.push({x:b.x-3,y:CFG.groundY-6,t:12,kind:'spark'});G.aBullets.splice(i,1);}
  }
}
function shakerTick(){
  const sh=G.shaker,K=CFG.shaker;
  if(sh){sh.x+=sh.dir*K.speed;if(sh.x<-12||sh.x>W+4){G.shaker=null;Audio.loopStop();}return;}
  if(++G.shakerTimer>K.interval&&aliveCount()>=K.minAliens){G.shakerTimer=0;const dir=G.shots%2?-1:1;G.shaker={x:dir>0?-8:W,y:K.y,dir};Audio.loopStart();}
}
function tickBooms(){for(const b of G.booms)b.t--;G.booms=G.booms.filter(b=>b.t>0);}

function update(){
  G.frame++;
  if(G.shake>0)G.shake--;
  if(G.paused)return;
  if(G.state==='title'){if(G.frame%30===0)G.titleFrame^=1;if(startReq){startReq=false;newGame();}return;}
  if(G.state==='over'){if(G.timer>0)G.timer--;if(startReq){startReq=false;if(G.timer<=0)newGame();}tickBooms();return;}
  if(G.state==='prize'){
    if(G.timer>0)G.timer--;tickBooms();
    if(startReq){startReq=false;if(G.timer<=0&&!UI.isOpen)showBanner(['KEEP LIFTING!','NEXT SET: 11',setLabel(10)],140,'cleared');}
    return;
  }
  startReq=false;tickBooms();
  if(G.player.fireT>0)G.player.fireT--;
  if(G.state==='intro'){if(--G.timer<=0){G.banner=null;G.state='play';}return;}
  if(G.state==='dying'){if(--G.timer<=0){G.lives--;if(G.lives<=0)gameOver();else{G.state='play';G.player.x=8;}}return;}
  if(G.state==='cleared'){if(--G.timer<=0){G.wave++;startWave();showBanner(['SET '+(G.wave+1),setLabel(G.wave)],80,'intro');}return;}
  // play
  const P=G.player,maxX=W-CFG.player.minX-CFG.player.w;
  if(keys.left)P.x=Math.max(CFG.player.minX,P.x-CFG.player.speed);
  if(keys.right)P.x=Math.min(maxX,P.x+CFG.player.speed);
  if(keys.fire&&!G.pBullet){G.pBullet={x:(P.x|0)+6,y:P.y-3};P.fireT=10;G.shots++;Audio.fx.shoot();}
  if(G.pBullet)movePB();
  if(aliveCount()===0){
    G.shaker=null;Audio.loopStop();G.aBullets=[];G.pBullet=null;
    if(G.wave===9&&!G.prizeShown){G.prizeShown=true;Audio.fx.pb();G.state='prize';G.timer=90;doClaim();return;}
    Audio.fx.setDone();
    const cheer=CFG.cheers[Math.random()*CFG.cheers.length|0];
    showBanner([cheer,'NEXT SET: '+(G.wave+2),setLabel(G.wave+1)],140,'cleared');return;
  }
  const n=aliveCount();
  const steps=n<=4?1:1+(G.wave>=5?1:(G.wave>=2&&G.frame%2===0?1:0));
  for(let i=0;i<steps;i++)stepAliens();
  if(G.invaded){G.invaded=false;G.lives=1;killPlayer();return;}
  alienFire();moveAB();
  if(G.state!=='play')return;
  shakerTick();
}

const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire',ArrowUp:'fire',KeyW:'fire'};
const canStart=()=>G.state==='title'||((G.state==='over'||G.state==='prize')&&G.timer<=0);
const sndBtn=document.getElementById('bSound'),restBtn=document.getElementById('bRest');
function togglePause(){if(['play','dying','cleared','intro'].includes(G.state)){G.paused=!G.paused;restBtn.textContent=G.paused?'RESUME':'REST';if(G.paused)Audio.loopStop();else if(G.shaker)Audio.loopStart();}}
function toggleMute(){Audio.muted=!Audio.muted;sndBtn.textContent=Audio.muted?'MUTED':'SOUND';if(!Audio.muted&&G.shaker&&!G.paused)Audio.loopStart();}
addEventListener('keydown',e=>{
  if(UI.isOpen){if(e.code==='Escape')UI.close();return;}
  Audio.init();
  const k=KEYMAP[e.code];if(k){keys[k]=true;e.preventDefault();}
  if((e.code==='Enter'||e.code==='Space')&&canStart())startReq=true;
  if(e.code==='KeyP'&&!e.repeat)togglePause();
  if(e.code==='KeyM'&&!e.repeat)toggleMute();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
function releaseAll(){if(typeof keys==='undefined')return;keys.left=keys.right=keys.fire=false;document.querySelectorAll('[data-k].on').forEach(b=>b.classList.remove('on'));}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();if(G.state==='play'&&!G.paused)togglePause();}});
// Multi-touch: each button tracks its own pointers, so move + lift work together.
document.querySelectorAll('[data-k]').forEach(btn=>{
  const k=btn.dataset.k,ids=new Set();
  const on=e=>{e.preventDefault();Audio.init();ids.add(e.pointerId);keys[k]=true;btn.classList.add('on');if(k==='fire'&&canStart())startReq=true;if(G.paused)togglePause();try{btn.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{ids.delete(e.pointerId);if(!ids.size){keys[k]=false;btn.classList.remove('on');}};
  btn.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,off));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});
restBtn.addEventListener('click',()=>{Audio.init();togglePause();});
sndBtn.addEventListener('click',()=>{Audio.init();toggleMute();});
cv.addEventListener('pointerdown',()=>{Audio.init();if(canStart())startReq=true;else if(G.paused)togglePause();});
document.getElementById('bAccount').addEventListener('click',()=>UI.open(!Online.available?'offline':Online.ready?'account':Online.user?'nick':'auth'));
document.getElementById('bBoard').addEventListener('click',()=>UI.open('board'));
document.getElementById('bRules').addEventListener('click',()=>UI.open('rules'));
['touchend','click'].forEach(ev=>addEventListener(ev,()=>Audio.init(),{passive:true}));
document.addEventListener('touchmove',e=>{if(e.target.closest('button,canvas'))e.preventDefault();},{passive:false});

    }else if(view==='board'){
      const per=opts.period==='month'?'month':'all';title.textContent='TOP 10';
      body.innerHTML=`<div class="tabs" role="tablist"><button role="tab" id="tAll" aria-selected="${per==='all'}">ALL-TIME</button><button role="tab" id="tMon" aria-selected="${per==='month'}">THIS MONTH</button></div>
        <div class="board-wrap" id="bWrap"><p class="fine">Loading...</p></div>
        ${Online.ready?'':'<button class="link" id="lJoin" type="button">Sign in to get on the board</button>'}`;
      $('tAll').onclick=()=>{opts.period='all';render();};$('tMon').onclick=()=>{opts.period='month';render();};
      if($('lJoin'))$('lJoin').onclick=()=>{view=Online.user?'nick':'auth';opts={tab:'join'};render();};
      if(!Online.available){$('bWrap').innerHTML='<p class="fine">The leaderboard needs an internet connection.</p>';return;}
      Online.board(per).then(rows=>{
        if(view!=='board')return;const mine=Online.me&&Online.me.nickname;
        $('bWrap').innerHTML=rows&&rows.length?`<table class="board"><thead><tr><th>#</th><th>NAME</th><th class="n">REPS</th><th class="n">SET</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.nickname===mine?'me':''}"><td>${r.rank}</td><td>${esc(r.nickname)}</td><td class="n">${r.score}</td><td class="n">${r.set_reached}</td></tr>`).join('')}</tbody></table>`:`<p class="fine">No scores yet${per==='month'?' this month':''}. Be the first!</p>`;
      }).catch(()=>{if(view==='board')$('bWrap').innerHTML='<p class="fine">Could not load the leaderboard. Check your connection.</p>';});
    }else if(view==='share'){
      const d=opts,full=d.text+' '+d.url,enc=encodeURIComponent;
      title.textContent='CHALLENGE A FRIEND';
      body.innerHTML=`<textarea class="sharemsg" id="shMsg" readonly aria-label="Challenge message">${esc(full)}</textarea>
        <div class="sharegrid">
          <button class="go" id="shCopy" type="button">COPY</button>
          <a class="go" href="https://wa.me/?text=${enc(full)}" target="_blank" rel="noopener">WHATSAPP</a>
          <a class="go" href="https://www.facebook.com/sharer/sharer.php?u=${enc(d.url)}" target="_blank" rel="noopener">FACEBOOK</a>
          <a class="go" href="sms:?&body=${enc(full)}">TEXT</a>
        </div><p class="msg ok" id="mMsg" role="status"></p>`;
      $('shCopy').onclick=()=>{const t=$('shMsg');
        const sel=()=>{t.focus();t.select();say('Selected. Press copy on your keyboard.',true);};
        try{navigator.clipboard.writeText(full).then(()=>say('Copied! Paste it to a friend.',true),sel);}catch(e){sel();}};
    }else if(view==='rules'){
      title.textContent='HOW TO PLAY';
      const img=s=>`<img alt="" src="${s.c.toDataURL()}" style="height:${s.h*2.25}px">`;
      const ctl=TOUCH?['◀ ▶ buttons','LIFT button','REST button']:['← → or A D','SPACE','P'];
      body.innerHTML=`<div class="rules">
        <h3>THE GOAL</h3>
        <p>Gym equipment is invading. Lift it out of the sky before it reaches your lifter. Clear the whole formation to finish a set.</p>
        <h3>CONTROLS</h3>
        <ul><li><span class="k">MOVE:</span> ${ctl[0]}</li><li><span class="k">LIFT (FIRE):</span> ${ctl[1]}</li><li><span class="k">REST (PAUSE):</span> ${ctl[2]}</li>${TOUCH?'':'<li><span class="k">SOUND:</span> M</li>'}</ul>
        <h3>REP VALUES</h3>
        <table class="rv"><tbody>
          <tr><td>${img(SPR.shaker[0])}</td><td>Golden shaker</td><td class="n">50-300</td></tr>
          ${TYPES.map(t=>`<tr><td>${img(SPR[t.k][0])}</td><td>${t.name.charAt(0)+t.name.slice(1).toLowerCase()}</td><td class="n">${t.pts}</td></tr>`).join('')}
        </tbody></table>
        <p class="fine" style="text-align:left">The golden shaker flies across the top now and then. Its mystery value depends on how many shots you've taken.</p>
        <h3>ENERGY (LIVES)</h3>
        <ul><li>You start with <span class="k">${CFG.lives} energy</span>.</li><li>Earn <span class="k">1 bonus energy every ${CFG.extraLifeEvery.toLocaleString()} reps</span>.</li><li>Each hit costs 1 energy.</li><li>If the equipment reaches your lifter, it's workout over.</li></ul>
        <h3>SQUAT RACKS</h3>
        <p>Hide behind the 4 racks. Every hit chips a piece off, including your own shots. They're rebuilt good as new at the start of every set.</p>
        <h3>SETS</h3>
        <p>Every set starts lower and attacks faster: Beginner, Warming Up, Getting Stronger, Heavy Lifting, then BEAST MODE.</p>
        <h3>WIN $100</h3>
        <ul><li>Clear <span class="k">SET 10</span> to win a <span class="k">$100 No Limits gift voucher</span>.</li><li>Only 10 vouchers. One per person.</li><li>You must be signed in. Your code shows on screen and is emailed to you.</li><li>Use your code when you <a href="https://nolimitshealthclubs.gymmasteronline.com/portal/signup" target="_blank" rel="noopener" style="color:var(--gold)">join or renew online</a>, or as a credit towards your weekly direct debit if you're already a member.</li></ul>
        <h3>TOP 10</h3>
        <p>Sign in and every finished game is saved. Chase the all-time and monthly Top 10 boards.</p>
      </div><button class="go" id="bOk" style="margin-top:18px">LET'S LIFT</button>
      <p class="fine">Version ${APP_VERSION}</p>`;
      $('bOk').onclick=close;
    }else{
      title.textContent='OFFLINE';body.innerHTML='<p>The leaderboard and sign-in need an internet connection. You can still play, and your personal best is saved on this device.</p><button class="go" id="bOk">OK</button>';$('bOk').onclick=close;
    }
  }
  document.getElementById('mClose').onclick=close;
  modal.addEventListener('pointerdown',e=>{if(e.target===modal)close();});
  return{open,close,get isOpen(){return!modal.hidden},refresh(){if(!modal.hidden&&view==='account')render();}};
})();
const accBtn=document.getElementById('bAccount');
Online.on(()=>{
  accBtn.textContent=Online.ready?Online.me.nickname:'SIGN IN TO WIN';UI.refresh();
  if(!Online.ready)return;
  adoptUnsaved();flushQueue();
  if(G.state==='prize'&&G.prize&&G.prize.status==='signin')doClaim();
  else claimSaved();
});
Online.init();

/* ================= SCALING + LOOP ================= */
const stage=document.getElementById('stage'),crt=document.getElementById('crt');
function fit(){const r=stage.getBoundingClientRect();const k=Math.min(r.width/W,r.height/H);crt.style.width=Math.floor(W*k)+'px';crt.style.height=Math.floor(H*k)+'px';}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);fit();
const STEP=1000/60;let acc=0,last=performance.now();
function frame(t){acc+=Math.min(200,t-last);last=t;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(frame);}
makeRacks();startWave();G.state='title';draw();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);

/* ================= PWA: offline + safe updates ================= */
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had||reloading)return;
    if(['play','dying','cleared','intro'].includes(G.state)){G.pendingReload=true;return;}
    reloading=true;location.reload();
  });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>{try{reg.update()}catch(e){}};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});addEventListener('pageshow',check);
  }).catch(()=>{});
}

/* test hook: only with ?debug in the URL */
if(/[?&]debug\b/.test(location.search))window.__RI={G,keys,Records,TYPES,Online,UI,step:n=>{for(let i=0;i<n;i++)update();draw();},start:()=>{startReq=true;},kill:()=>G.aliens.forEach(a=>a.alive=false),rackPixels:()=>G.racks.reduce((s,b)=>s+b.d.reduce((t,v)=>t+(v?1:0),0),0),spawnShaker:()=>{G.shakerTimer=CFG.shaker.interval+1;}};
})();
</script>
